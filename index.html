<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AG4 FROTA</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <h1>AG4 FROTA - GESTÃO DE VEÍCULOS</h1>
    <button class="btn btn-primary" onclick="abrirModalManutencao()">+ REGISTRAR MANUTENÇÃO</button>
  </header>

  <main class="container">
    <section class="card">
      <h2>HISTÓRICO DE MANUTENÇÕES</h2>
      <div class="table-responsive">
        <table id="tabelaHistorico">
          <thead>
            <tr id="cabecalhoTabela">
              <th>DATA</th>
              <th>PLACA</th>
              <th>VEÍCULO</th>
              <th>TIPO SERVIÇO</th>
              <th>KM ATUAL</th>
              <th>PRÓX. TROCA</th>
              <th>ALARME</th>
              <th>AÇÕES</th>
            </tr>
          </thead>
          <tbody>
            <!-- Dados carregados via JS -->
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- MODAL MANUTENÇÃO -->
  <div id="modalManutencao" class="modal" aria-hidden="true">
    <div class="modal-content">
      <button type="button" class="close" onclick="fecharModalManutencao()" aria-label="Fechar">&times;</button>
      <h2>REGISTRAR MANUTENÇÃO</h2>

      <div class="form-group">
        <label for="dataManutencao">DATA DA MANUTENÇÃO</label>
        <input type="date" id="dataManutencao">
      </div>

      <div class="form-group">
        <label for="selectVeiculoManutencao">PLACA</label>
        <select id="selectVeiculoManutencao" onchange="carregarNomeVeiculo()">
          <option value="">SELECIONE UM VEÍCULO</option>
        </select>
      </div>

      <div class="form-group">
        <label for="nomeVeiculoManutencao">NOME_VEICULO</label>
        <input type="text" id="nomeVeiculoManutencao" placeholder="CARREGA AUTOMÁTICO" readonly>
      </div>

      <div class="form-group">
        <label for="tipoManutencao">TIPO</label>
        <input type="text" id="tipoManutencao" placeholder="EX: TROCA DE ÓLEO, PNEU">
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label for="kmManutencao">KM ATUAL</label>
          <input type="number" id="kmManutencao" min="0" placeholder="KM ATUAL">
        </div>
        <div class="form-group">
          <label for="proximaTrocaKm">PRÓXIMA TROCA</label>
          <input type="number" id="proximaTrocaKm" min="0" placeholder="KM PRÓXIMA TROCA">
        </div>
      </div>

      <!-- OPÇÃO DE ALARME / LEMBRETE -->
      <div class="form-group" style="margin-top: 15px;">
        <label class="checkbox-alarme-label" style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
          <input type="checkbox" id="chkAtivarAlarme" onchange="toggleCamposAlarme()">
          ⏰ DEFINIR ALARME / LEMBRETE
        </label>
      </div>

      <div id="containerAlarme" style="display: none; background: #f8f9fa; padding: 12px; border-radius: 6px; border: 1px dashed #ccc; margin-bottom: 15px;">
        
        <div class="form-group">
          <label for="dataAlarme">DATA DO ALARME</label>
          <input type="date" id="dataAlarme">
        </div>

        <div class="form-group" style="margin-top: 10px;">
          <label for="horasAlarme">DISPARAR APÓS (EM HORAS)</label>
          <input type="number" id="horasAlarme" min="1" placeholder="EX: 2 (AVISAR 2H APÓS O REGISTRO)">
        </div>

      </div>

      <div class="btn-group">
        <button type="button" class="btn btn-primary" onclick="registrarManutencao()">SALVAR</button>
        <button type="button" class="btn btn-secondary" onclick="fecharModalManutencao()">CANCELAR</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
