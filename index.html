<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      * { box-sizing: border-box; font-family: Arial, Helvetica, sans-serif; }
      body { margin: 15px; background-color: #ffffff; color: #333; }
      
      .header-title { 
        color: #1a62bf; 
        font-weight: bold; 
        font-size: 16px; 
        margin-bottom: 15px; 
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .form-group { margin-bottom: 12px; }
      .row { display: flex; gap: 10px; }
      .col { flex: 1; }

      label { 
        display: block; 
        font-size: 11px; 
        font-weight: bold; 
        color: #555; 
        margin-bottom: 4px; 
        text-transform: uppercase; 
      }

      input[type="text"], 
      input[type="date"], 
      input[type="time"], 
      select { 
        width: 100%; 
        padding: 8px 10px; 
        border: 1px solid #ccc; 
        border-radius: 4px; 
        font-size: 13px; 
        outline: none; 
      }

      input[readonly] { background-color: #eaeaea; color: #555; }
      input:focus, select:focus { border-color: #1a62bf; }

      /* Caixa de Alarme */
      .checkbox-container { 
        display: flex; 
        align-items: center; 
        gap: 6px; 
        margin: 15px 0 8px 0; 
      }

      .checkbox-container label { 
        color: #1a62bf; 
        font-size: 12px; 
        cursor: pointer; 
        margin: 0; 
      }

      .alarm-box { 
        border: 1px dashed #bbb; 
        background-color: #fcfcfc; 
        padding: 12px; 
        border-radius: 4px; 
        margin-bottom: 15px; 
      }

      /* Botões */
      .btn-container { display: flex; gap: 10px; margin-top: 15px; }
      
      .btn { 
        flex: 1; 
        padding: 10px; 
        border: none; 
        border-radius: 4px; 
        font-weight: bold; 
        color: white; 
        cursor: pointer; 
        font-size: 13px; 
      }

      .btn-salvar { background-color: #1565c0; }
      .btn-cancelar { background-color: #1565c0; }
      .btn:hover { opacity: 0.9; }
      .btn:disabled { background-color: #ccc; cursor: not-allowed; }
    </style>
  </head>
  <body>

    <div class="header-title">Registrar Manutenção</div>

    <form id="formManutencao">
      
      <!-- Data e Horário -->
      <div class="form-group row">
        <div class="col">
          <label>Data</label>
          <input type="date" id="data" required>
        </div>
        <div class="col">
          <label>Horário</label>
          <input type="time" id="horario" required>
        </div>
      </div>

      <!-- Placa -->
      <div class="form-group">
        <label>Placa</label>
        <select id="placa" onchange="atualizarNomeVeiculo()" required>
          <option value="">Selecione...</option>
          <option value="GERADOR ARMAZÉM - A0">GERADOR ARMAZÉM - A0</option>
        </select>
      </div>

      <!-- Nome Veículo -->
      <div class="form-group">
        <label>Nome_Veiculo</label>
        <input type="text" id="nome_veiculo" readonly placeholder="GERADOR ARMAZÉM">
      </div>

      <!-- Tipo -->
      <div class="form-group">
        <label>Tipo</label>
        <input type="text" id="tipo" required placeholder="EX: TROCA / COMBUSTÍVEL">
      </div>

      <!-- KM e Próxima Troca -->
      <div class="form-group row">
        <div class="col">
          <label>KM</label>
          <input type="text" id="km" required placeholder="00:00 ou KM">
        </div>
        <div class="col">
          <label>Próxima Troca (KM)</label>
          <input type="text" id="proxima_troca" required placeholder="1">
        </div>
      </div>

      <!-- Checkbox Lembrete -->
      <div class="checkbox-container">
        <input type="checkbox" id="chkAlarme" onchange="toggleAlarme()">
        <label for="chkAlarme">⏰ DEFINIR ALARME / LEMBRETE</label>
      </div>

      <!-- Painel do Alarme -->
      <div id="alarmBox" class="alarm-box" style="display: none;">
        <div class="form-group row">
          <div class="col">
            <label>Definir Alarme / Lembrete (Data)</label>
            <input type="date" id="alarme_data">
          </div>
          <div class="col">
            <label>Definir Alarme / Lembrete (Hora)</label>
            <input type="time" id="alarme_hora">
          </div>
        </div>
        
        <div class="form-group" style="margin-bottom: 0;">
          <label>Observação (do Alarme)</label>
          <input type="text" id="observacao_alarme" placeholder="EX: CHECAR NÍVEL DO ÓLEO">
        </div>
      </div>

      <!-- Ações -->
      <div class="btn-container">
        <button type="button" class="btn btn-salvar" id="btnSalvar" onclick="salvarDadosFormulario()">SALVAR</button>
        <button type="button" class="btn btn-cancelar" onclick="google.script.host.close()">CANCELAR</button>
      </div>

    </form>

    <script>
      // Preenche Data e Hora padrão ao abrir
      window.onload = function() {
        const hoje = new Date();
        const dataFormatada = hoje.toISOString().split('T')[0];
        const horaFormatada = hoje.toTimeString().split(' ')[0].substring(0, 5);
        
        document.getElementById('data').value = dataFormatada;
        document.getElementById('horario').value = horaFormatada;
      };

      function atualizarNomeVeiculo() {
        const placaVal = document.getElementById('placa').value;
        if (placaVal.includes('-')) {
          document.getElementById('nome_veiculo').value = placaVal.split('-')[0].trim();
        } else {
          document.getElementById('nome_veiculo').value = placaVal;
        }
      }

      function toggleAlarme() {
        const chk = document.getElementById('chkAlarme').checked;
        document.getElementById('alarmBox').style.display = chk ? 'block' : 'none';
      }

      function salvarDadosFormulario() {
        const btn = document.getElementById('btnSalvar');
        
        // Pega ou DATA ou HORA no alarme
        let alarmeValor = "";
        const dataAlarme = document.getElementById('alarme_data').value;
        const horaAlarme = document.getElementById('alarme_hora').value;

        if (document.getElementById('chkAlarme').checked) {
          if (dataAlarme) {
            alarmeValor = dataAlarme;
          } else if (horaAlarme) {
            alarmeValor = horaAlarme;
          }
        }

        // Mapeamento dos campos enviado ao servidor
        const dados = {
          data: document.getElementById('data').value,
          hora: document.getElementById('horario').value,
          placa: document.getElementById('placa').value,
          nome_veiculo: document.getElementById('nome_veiculo').value,
          tipo: document.getElementById('tipo').value,
          km: document.getElementById('km').value,
          proxima_troca: document.getElementById('proxima_troca').value,
          alarme: alarmeValor,
          observacao: document.getElementById('chkAlarme').checked ? document.getElementById('observacao_alarme').value : ""
        };

        // Validação simples
        if (!dados.placa || !dados.tipo || !dados.km) {
          alert("Por favor, preencha os campos obrigatórios (Placa, Tipo e KM).");
          return;
        }

        btn.disabled = true;
        btn.innerText = "SALVANDO...";

        google.script.run
          .withSuccessHandler(function() {
            google.script.host.close();
          })
          .withFailureHandler(function(err) {
            alert("Erro ao salvar: " + err.message);
            btn.disabled = false;
            btn.innerText = "SALVAR";
          })
          .salvarManutencaoNoSheet(dados);
      }
    </script>
  </body>
</html>
