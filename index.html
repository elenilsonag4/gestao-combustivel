<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <?!= include('style'); ?>
</head>
<body>
  <div class="container">
    <header>
      <!-- TROQUE PELO LINK DA SUA LOGO DO DRIVE -->
      <img src="https://drive.google.com/uc?export=view&id=COLOQUE_O_ID_DA_IMAGEM_AQUI" alt="AG4 FROTA" class="logo">
      <h1>GESTÃO COMBUSTÍVEL</h1>
    </header>

    <div class="section-title">GERENCIAR VEÍCULOS</div>
    <div class="card">
      <h2>CADASTRO DE VEÍCULO</h2>
      <label>NOME</label>
      <input type="text" id="nomeVeiculo" placeholder="NOME DO VEÍCULO">
      <label>PLACA</label>
      <input type="text" id="placaVeiculo" placeholder="DIGITE A PLACA">
      <div class="btn-group">
        <button class="btn btn-primary" onclick="cadastrarVeiculo()">CADASTRAR</button>
        <button class="btn btn-primary" onclick="editarVeiculo()">EDITAR</button>
      </div>
    </div>

    <div class="section-title">REGISTRAR ABASTECIMENTO</div>
    <div class="card">
      <h2>ABASTECIMENTO</h2>
      <div class="grid-2">
        <div><label>DATA</label><input type="date" id="dataAbastecimento"></div>
        <div><label>LISTA DE VEÍCULOS</label><select id="selectVeiculo"><option>Carregando...</option></select></div>
      </div>
      <div class="grid-2">
        <div><label>MOTORISTA</label><input type="text" id="motorista"></div>
        <div><label>LITROS</label><input type="number" step="0.01" id="litros"></div>
      </div>
      <div class="grid-2">
        <div><label>VALOR TOTAL R$</label><input type="number" step="0.01" id="valorTotal"></div>
        <div><label>KM ATUAL</label><input type="number" id="kmAtual"></div>
      </div>
      <div class="btn-group">
        <button class="btn btn-primary" onclick="registrarAbastecimento()">REGISTRAR</button>
        <button class="btn btn-primary" onclick="abrirModalManutencao()">MANUTENÇÃO</button>
      </div>
    </div>

    <div class="section-title">HISTÓRICO</div>
    <div class="card">
      <table id="tabelaHistorico">
        <thead>
          <tr><th>DATA</th><th>VEICULO</th><th>PLACA</th><th>MOTORISTA</th><th>LITROS</th><th>VALOR</th><th>KM</th><th>CONSUMO</th><th>AÇÃO</th></tr>
        </thead>
        <tbody></tbody>
      </table>
      <div class="btn-group" style="margin-top:15px;">
        <button class="btn btn-primary" onclick="gerarPDF('geral')">GERAL</button>
        <button class="btn btn-primary" onclick="gerarPDF('seletiva')">SELETIVA</button>
      </div>
    </div>
  </div>

  <div id="modalManutencao" class="modal">
    <div class="modal-content">
      <span class="close" onclick="fecharModalManutencao()">&times;</span>
      <h2>REGISTRAR MANUTENÇÃO</h2>
      <label>VEÍCULO</label><select id="selectVeiculoManutencao"></select>
      <label>TIPO</label>
      <select id="tipoManutencao">
        <option value="Troca de Óleo">Troca de Óleo</option>
        <option value="Troca de Filtro">Troca de Filtro</option>
      </select>
      <label>KM DA TROCA</label><input type="number" id="kmManutencao">
      <button class="btn btn-primary" onclick="registrarManutencao()">SALVAR</button>
    </div>
  </div>

  <?!= include('script'); ?>
</body>
</html>
