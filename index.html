<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SISTEMA FROTA</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h1>CONTROLE DE FROTA</h1>

    <div class="menu">
        <button onclick="mostrarTela('cadVeiculo')">CADASTRAR VEICULO</button>
        <button onclick="mostrarTela('cadAbastecimento')">NOVO ABASTECIMENTO</button>
        <button onclick="mostrarTela('relatorios')">RELATÓRIOS</button>
    </div>

    <div id="cadVeiculo" class="card tela">
        <h2>CADASTRAR VEICULO</h2>
        <form id="formVeiculo">
            <label>PLACA</label><input type="text" id="placaVeiculo" placeholder="AAA-1234" required>
            <label>NOME VEICULO</label><input type="text" id="nomeVeiculo" placeholder="HILUX SRX" required>
            <label>ANO</label><input type="number" id="anoVeiculo">
            <label>OBS</label><input type="text" id="obsVeiculo">
            <button type="submit">SALVAR VEICULO</button>
        </form>
        <h3>VEICULOS CADASTRADOS</h3>
        <div id="listaVeiculos"></div>
    </div>

    <div id="cadAbastecimento" class="card tela" style="display:none;">
        <h2>NOVO ABASTECIMENTO</h2>
        <form id="formAbastecimento">
            <label>DATA</label><input type="date" id="data" required>
            <label>VEICULO</label><select id="selectVeiculo" required></select>
            <label>MOTORISTA</label><input type="text" id="motorista" required>
            <label>LITROS</label><input type="number" step="0.01" id="litros" required>
            <label>VALOR TOTAL R$</label><input type="number" step="0.01" id="valor" required>
            <label>KM ATUAL</label><input type="number" id="km" required>
            <button type="submit">SALVAR ABASTECIMENTO</button>
        </form>
    </div>

    <div id="relatorios" class="card tela" style="display:none;">
        <h2>RELATÓRIOS</h2>
        <label>TIPO</label>
        <select id="tipoRel"><option value="lista">LISTA COMPLETA</option><option value="consumo">CONSUMO POR VEICULO</option></select>
        <label>FILTRAR POR VEICULO</label><select id="filtroVeiculo"><option value="">TODOS</option></select>
        <label>PERIODO</label><div class="periodo"><input type="date" id="dataInicial"><input type="date" id="dataFinal"></div>
        <button onclick="mostrar()">GERAR RELATORIO</button>
        <button onclick="gerarPDF()" class="btn-pdf">GERAR PDF</button>
    </div>

    <div id="senhaBox" class="card senha-card" style="display:none;">
        <h2>CONFIRMAR EXCLUSÃO</h2>
        <input type="password" id="senhaInput" placeholder="DIGITE A SENHA: 1234">
        <button onclick="confirmarExclusao()">CONFIRMAR</button>
        <button onclick="cancelarExclusao()" class="btn-cancelar">CANCELAR</button>
    </div>

    <div id="resultado"></div>
</div>
<script src="script.js"></script>
</body>
</html>
