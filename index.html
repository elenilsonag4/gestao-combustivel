<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AG4 FROTA - Gestão Combustível</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    
    <header>
      <img src="logo frota.png" alt="AG4 FROTA" class="logo">
      <h1>GESTÃO COMBUSTÍVEL</h1>
    </header>

    <div class="section-title">GERENCIAR VEÍCULOS</div>
    <div class="card">
      <h2>CADASTRO DE VEÍCULO</h2>
      <div class="form-group">
        <label for="nomeVeiculo">NOME</label>
        <input type="text" id="nomeVeiculo" placeholder="NOME DO VEÍCULO">
      </div>
      <div class="form-group">
        <label for="placaVeiculo">PLACA</label>
        <input type="text" id="placaVeiculo" placeholder="DIGITE A PLACA">
      </div>
      <div class="btn-group">
        <button class="btn btn-primary">CADASTRAR</button>
        <button class="btn btn-primary">EDITAR</button>
      </div>
    </div>

    <div class="section-title">REGISTRAR ABASTECIMENTO</div>
    <div class="card">
      <h2>ABASTECIMENTO</h2>
      <div class="grid-2">
        <div class="form-group">
          <label for="dataAbastecimento">DATA</label>
          <input type="date" id="dataAbastecimento">
        </div>
        <div class="form-group">
          <label for="selectVeiculo">LISTA DE VEÍCULOS</label>
          <select id="selectVeiculo">
            <option>Selecione um veículo</option>
          </select>
        </div>
      </div>
      <div class="grid-2">
        <div class="form-group">
          <label for="motorista">MOTORISTA</label>
          <input type="text" id="motorista" placeholder="NOME DO MOTORISTA">
        </div>
        <div class="form-group">
          <label for="litros">LITROS</label>
          <input type="number" step="0.01" id="litros" placeholder="0.00">
        </div>
      </div>
      <div class="grid-2">
        <div class="form-group">
          <label for="valorTotal">VALOR TOTAL R$</label>
          <input type="number" step="0.01" id="valorTotal" placeholder="0.00">
        </div>
        <div class="form-group">
          <label for="kmAtual">KM ATUAL</label>
          <input type="number" id="kmAtual" placeholder="KM">
        </div>
      </div>
      <div class="btn-group">
        <button class="btn btn-primary">REGISTRAR</button>
        <button class="btn btn-primary">MANUTENÇÃO</button>
      </div>
    </div>

    <div class="section-title">HISTÓRICO</div>
<div class="card">
  <div class="btn-group">
    <button class="btn btn-primary">GERAL</button>
    <button class="btn btn-primary">SELETIVA</button>
  </div>
  
  <table>
    <thead>
      <tr>
        <th>DATA</th>
        <th>PLACA</th>
        <th>VEICULO</th>
        <th>MOTORISTA</th>
        <th>LITROS</th>
        <th>VALOR</th>
        <th>KM</th>
        <th>CONSUMO</th>
        <th>AÇÃO</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td colspan="9">Nenhum abastecimento registrado</td>
      </tr>
    </tbody>
  </table>
</div>

  </div>
  <script src="script.js"></script>
</body>
</html>
