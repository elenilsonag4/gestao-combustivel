<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GESTÃO COMBUSTIVEL</title>
<link rel="stylesheet" href="./style.css?v=1">
</head>
<body>
<div class="container">
    <h1>GESTÃO DE FROTA</h1>

    <div class="menu-topo">
        <button onclick="abrirModal()">NOVO ABASTECIMENTO</button>
        <button onclick="abrirModalVeiculos()">GERENCIAR VEÍCULOS</button>
    </div>

    <div class="card">
        <h2>RELATÓRIOS</h2>
        <label>TIPO DE RELATÓRIO</label>
        <select id="tipoRel" onchange="mudaTipoRel()">
            <option value="lista">LISTA COMPLETA</option>
            <option value="consumo">CONSUMO POR VEÍCULO</option>
        </select>
        <label id="labelFiltro">FILTRAR POR VEÍCULO</label>
        <select id="filtroVeiculo"></select>
        <label>PERÍODO</label>
        <div class="periodo">
            <input type="date" id="dataInicial">
            <input type="date" id="dataFinal">
        </div>
        <button onclick="mostrar()">GERAR RELATÓRIO</button>
        <button onclick="gerarPDF()" class="btn-pdf">GERAR PDF</button>
    </div>

    <div id="resultado"></div>
</div>

<!-- MODAL ABASTECIMENTO -->
<div id="modal" class="modal">
    <div class="modal-conteudo">
        <span class="fechar" onclick="fecharModal()">&times;</span>
        <h2>NOVO ABASTECIMENTO</h2>
        <form onsubmit="event.preventDefault(); salvar();">
            <label>DATA</label><input type="date" id="data" required>
            <label>VEÍCULO</label><select id="selectVeiculo" required></select>
            <label>MOTORISTA</label><input type="text" id="motorista" required>
            <label>LITROS</label><input type="number" step="0.01" id="litros" required>
            <label>VALOR TOTAL R$</label><input type="number" step="0.01" id="valor" required>
            <label>KM ATUAL</label><input type="number" id="km" required>
            <button type="submit">SALVAR</button>
        </form>
    </div>
</div>

<!-- MODAL VEÍCULOS -->
<div id="modalVeiculos" class="modal">
    <div class="modal-conteudo">
        <span class="fechar" onclick="fecharModalVeiculos()">&times;</span>
        <h2>CADASTRAR VEÍCULO</h2>
        <div class="form-veiculo">
            <label>PLACA</label><input type="text" id="placaNova" placeholder="AAA-1234">
            <label>NOME VEÍCULO</label><input type="text" id="nomeVeiculo" placeholder="HILUX SRX">
            <button onclick="cadastrarVeiculo()">ADICIONAR VEÍCULO</button>
        </div>
        <h3>VEÍCULOS CADASTRADOS</h3>
        <div id="listaVeiculosCadastrados"></div>
    </div>
</div>

<script src="./script.js?v=1"></script>
</body>
</html>
