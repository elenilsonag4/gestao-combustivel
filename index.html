<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrar Manutenção</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-800 flex items-center justify-center min-h-screen p-4">

  <div class="bg-white rounded-lg shadow-xl w-full max-w-md border border-gray-200 overflow-hidden">
    
    <!-- Header -->
    <div class="flex justify-between items-center px-5 py-4 border-b border-gray-200">
      <h2 class="text-blue-600 font-bold text-lg uppercase tracking-wide">Registrar Manutenção</h2>
      <button class="text-gray-400 hover:text-gray-600 text-xl font-bold">&times;</button>
    </div>

    <!-- Form -->
    <form class="p-5 space-y-4">
      
      <!-- Data -->
      <div>
        <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Data</label>
        <input type="date" value="2026-08-11" class="w-full border border-gray-300 rounded px-3 py-2 text-sm text-gray-700 focus:outline-none focus:border-blue-500">
      </div>

      <!-- Placa -->
      <div>
        <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Placa</label>
        <select class="w-full border border-gray-300 rounded px-3 py-2 text-sm text-gray-700 focus:outline-none focus:border-blue-500 bg-white">
          <option value="">SELECIONE UM VEÍCULO</option>
          <option value="ABC-1234">ABC-1234 - Gol 1.0</option>
        </select>
      </div>

      <!-- Nome Veículo -->
      <div>
        <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Nome_Veiculo</label>
        <input type="text" value="CARREGA AUTOMÁTICO" disabled class="w-full border border-gray-200 bg-gray-100 rounded px-3 py-2 text-sm text-gray-500 font-medium">
      </div>

      <!-- Tipo -->
      <div>
        <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Tipo</label>
        <input type="text" placeholder="EX: TROCA DE ÓLEO, PNEU" class="w-full border border-gray-300 rounded px-3 py-2 text-sm text-gray-700 focus:outline-none focus:border-blue-500">
      </div>

      <!-- KM & Próxima Troca -->
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-bold text-gray-600 uppercase mb-1">KM</label>
          <input type="number" placeholder="KM ATUAL" class="w-full border border-gray-300 rounded px-3 py-2 text-sm text-gray-700 focus:outline-none focus:border-blue-500">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Próxima Troca</label>
          <input type="number" placeholder="KM PRÓXIMA TROCA" class="w-full border border-gray-300 rounded px-3 py-2 text-sm text-gray-700 focus:outline-none focus:border-blue-500">
        </div>
      </div>

      <!-- Bloco Alarme / Lembrete Dinâmico -->
      <div class="border border-dashed border-gray-300 rounded-lg p-3 bg-gray-50">
        <div class="flex items-center gap-2 mb-2">
          <input type="checkbox" id="toggleAlarme" class="w-4 h-4 text-blue-600 rounded cursor-pointer">
          <label for="toggleAlarme" class="font-bold text-xs text-blue-600 uppercase cursor-pointer flex items-center gap-1">
            ⏰ Definir Alarme / Lembrete
          </label>
        </div>

        <div id="painelOpcoes" class="hidden space-y-3 pt-2">
          <!-- Radios -->
          <div class="flex gap-4 text-xs font-semibold text-gray-600">
            <label class="flex items-center gap-1 cursor-pointer">
              <input type="radio" name="tipoAlarme" value="data" checked class="text-blue-600"> Por Data
            </label>
            <label class="flex items-center gap-1 cursor-pointer">
              <input type="radio" name="tipoAlarme" value="horas" class="text-blue-600"> Por Horas Decorridas
            </label>
          </div>

          <!-- Input Data -->
          <div id="campoData">
            <label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">Data do Alarme</label>
            <input type="date" class="w-full border border-gray-300 rounded px-2 py-1.5 text-xs text-gray-700 focus:outline-none focus:border-blue-500">
          </div>

          <!-- Input Horas -->
          <div id="campoHoras" class="hidden">
            <label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">Avisar após quantas horas?</label>
            <div class="flex items-center gap-2">
              <input type="number" min="1" placeholder="Ex: 4" class="w-full border border-gray-300 rounded px-2 py-1.5 text-xs text-gray-700 focus:outline-none focus:border-blue-500">
              <span class="text-xs text-gray-500 font-medium whitespace-nowrap">horas depois</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Botões -->
      <div class="grid grid-cols-2 gap-3 pt-2">
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded text-sm transition">SALVAR</button>
        <button type="button" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded text-sm transition">CANCELAR</button>
      </div>

    </form>
  </div>

  <script>
    const toggleAlarme = document.getElementById('toggleAlarme');
    const painelOpcoes = document.getElementById('painelOpcoes');
    const radios = document.querySelectorAll('input[name="tipoAlarme"]');
    const campoData = document.getElementById('campoData');
    const campoHoras = document.getElementById('campoHoras');

    // Mostra/oculta opções ao marcar checkbox
    toggleAlarme.addEventListener('change', (e) => {
      if (e.target.checked) {
        painelOpcoes.classList.remove('hidden');
      } else {
        painelOpcoes.classList.add('hidden');
      }
    });

    // Alterna entre os campos de Data e Horas
    radios.forEach(radio => {
      radio.addEventListener('change', (e) => {
        if (e.target.value === 'data') {
          campoData.classList.remove('hidden');
          campoHoras.classList.add('hidden');
        } else {
          campoData.classList.add('hidden');
          campoHoras.classList.remove('hidden');
        }
      });
    });
  </script>
</body>
</html>
