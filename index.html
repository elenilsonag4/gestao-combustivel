<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Gerenciamento - AG4</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- CABEÇALHO -->
  <header>
    <h1>SISTEMA AG4</h1>
    <div class="user-bar">
      <span id="nomeUsuarioLogado">Usuário</span>
      <button type="button" class="btn btn-primary btn-sm" id="btnThemeToggle" onclick="toggleTheme()" title="Alternar Tema">🌙</button>
      <button type="button" class="btn btn-primary btn-sm" onclick="sincronizarComNuvem()">🔄</button>
      <button type="button" class="btn btn-primary btn-sm" onclick="fazerLogout()">SAIR</button>
    </div>
  </header>

  <main class="container">
    <!-- NAVEGAÇÃO DE ABAS -->
    <nav class="nav-tabs">
      <button class="tab-btn active" onclick="selecionarAba('aba1')">Painel Principal</button>
      <button class="tab-btn" onclick="selecionarAba('aba2')">Relatórios</button>
      <button class="tab-btn" onclick="selecionarAba('aba3')">Configurações</button>
    </nav>

    <!-- CONTEÚDO DAS ABAS -->
    <section id="aba1" class="tab-content active">
      <div class="card">
        <h2>Cadastro de Registros</h2>
        <form id="formCadastro">
          <div class="form-group">
            <label for="txtNome">Nome do Item / Cliente:</label>
            <input type="text" id="txtNome" placeholder="Digite aqui..." required>
          </div>

          <div class="form-group">
            <label for="selectCategoria">Categoria:</label>
            <select id="selectCategoria">
              <option value="opcao1">Opção 1</option>
              <option value="opcao2">Opção 2</option>
              <option value="opcao3">Opção 3</option>
            </select>
          </div>

          <div id="containerAlarme" style="background: #eef2f5; padding: 10px; border-radius: 4px; border: 1px solid #ccc; margin-bottom: 15px;">
            <label class="checkbox-alarme-label">
              <input type="checkbox" id="chkAlarme"> Ativar Alarme / Notificação
            </label>
          </div>

          <div class="checkbox-list">
            <div class="checkbox-item">
              <input type="checkbox" id="chk1"> <label for="chk1">Item Adicional A</label>
            </div>
            <div class="checkbox-item">
              <input type="checkbox" id="chk2"> <label for="chk2">Item Adicional B</label>
            </div>
          </div>

          <button type="submit" class="btn btn-primary" style="margin-top: 15px;">Salvar Registro</button>
        </form>
      </div>

      <div class="card" style="margin-top: 20px;">
        <h2>Registros Salvos</h2>
        <table class="data-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Nome</th>
              <th>Categoria</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>001</td>
              <td>Exemplo de Item A</td>
              <td>Opção 1</td>
              <td>
                <div class="dropdown">
                  <button class="btn btn-sm">Opções ▾</button>
                  <div class="dropdown-content">
                    <button onclick="editarItem(1)">Editar</button>
                    <button onclick="excluirItem(1)">Excluir</button>
                  </div>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

    <section id="aba2" class="tab-content">
      <div class="card">
        <h2>Relatórios Gerais</h2>
        <p>Conteúdo da aba de relatórios...</p>
      </div>
    </section>

    <section id="aba3" class="tab-content">
      <div class="card">
        <h2>Configurações do Sistema</h2>
        <p>Preferências da conta e sincronização.</p>
      </div>
    </section>
  </main>

  <!-- LÓGICA DE JAVASCRIPT INTEGRADA -->
  <script>
    // --- LÓGICA DO TEMA (CLARO / ESCURO) ---
    function toggleTheme() {
      const isDark = document.body.classList.toggle("dark-theme");
      localStorage.setItem("ag4_theme", isDark ? "dark" : "light");
      atualizarIconeTema(isDark);
    }

    function aplicarTemaSalvo() {
      const temaSalvo = localStorage.getItem("ag4_theme");
      const prefereEscuro = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      
      if (temaSalvo === "dark" || (!temaSalvo && prefereEscuro)) {
        document.body.classList.add("dark-theme");
        atualizarIconeTema(true);
      } else {
        document.body.classList.remove("dark-theme");
        atualizarIconeTema(false);
      }
    }

    function atualizarIconeTema(isDark) {
      const btn = document.getElementById("btnThemeToggle");
      if (btn) {
        btn.textContent = isDark ? "☀️" : "🌙";
      }
    }

    // --- TROCA DE ABAS ---
    function selecionarAba(idAba) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      
      document.getElementById(idAba).classList.add('active');
      event.currentTarget.classList.add('active');
    }

    // Ações Fictícias de Exemplo
    function sincronizarComNuvem() { alert("Sincronizando..."); }
    function fazerLogout() { alert("Saindo..."); }
    function editarItem(id) { alert("Editar item " + id); }
    function excluirItem(id) { alert("Excluir item " + id); }

    // Executa no carregamento
    document.addEventListener("DOMContentLoaded", aplicarTemaSalvo);
  </script>
</body>
</html>
